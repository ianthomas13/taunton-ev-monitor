name: Poll Taunton EV chargers

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: poller
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Poll feeds
        env:
          BP_PULSE_TOKEN: ${{ secrets.BP_PULSE_TOKEN }}
          INSTAVOLT_TOKEN: ${{ secrets.INSTAVOLT_TOKEN }}
          SMART_CHARGE_TOKEN: ${{ secrets.SMART_CHARGE_TOKEN }}
          SWARCO_TOKEN: ${{ secrets.SWARCO_TOKEN }}
        run: python poller.py
      - name: Commit new data
        run: |
          git config user.name  "ev-poller"
          git config user.email "ev-poller@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No new data"; exit 0
          fi
          git commit -m "data: poll $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            sleep 5
          done
          exit 1
